<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LML One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{
  --bg:#FFFFFF; --tone:#FCF8ED; --tone2:#F0F2E9; --ink:#000000; --inv:#FFFFFF; --rule:#A3A3A3; --edge:transparent;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#000000;--tone:#161616;--tone2:#262626;--ink:#FFFFFF;--inv:#000000;--rule:#626262;--edge:#626262;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#000000;--tone:#161616;--tone2:#262626;--ink:#FFFFFF;--inv:#000000;--rule:#626262;--edge:#626262;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.3;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;letter-spacing:inherit;padding:0}
input,textarea{font:inherit;color:var(--ink);letter-spacing:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding-bottom:100px;background:var(--bg);min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
@media (min-width:560px){body{background:var(--tone2)}.app{box-shadow:0 0 0 1px var(--rule)}}

/* icons and the Foundation shape */
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fnd{width:22px;height:22px;flex:none}
.fnd.solid{fill:var(--ink)}
.fnd.line{fill:none;stroke:var(--ink);stroke-width:1.4}
.fnd.half{fill:var(--tone2);stroke:var(--ink);stroke-width:2.4}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:6px;height:60px;padding:0 10px 0 16px}
.brand{display:flex;align-items:center;flex:1;padding-left:4px;color:var(--ink)}
.logo{display:block;height:20px;width:auto;fill:currentColor}
.lockup{display:block;height:64px;width:auto;max-width:100%;fill:currentColor}
.lk-wrap{padding:6px 0 2px}
.lm{display:inline-block;height:.72em;width:auto;vertical-align:baseline;fill:currentColor}
.hero-b>h2{margin:2px 0 6px}
.lk-wrap .lockup{height:52px}
.ttl{flex:1;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{margin-left:-8px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:10px;position:relative;flex:none}
.icon-btn .dot{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--inv);font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}

/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,460px);z-index:25;background:var(--bg);border-top:1px solid var(--tone2);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:flex;height:64px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;text-align:center}
.nav button.on{font-weight:700;box-shadow:inset 0 2px 0 var(--ink)}
.nav button.on .ic{stroke-width:2.2}

/* layout */
.pad{padding:0 16px;margin-top:24px}
.pad:first-child{margin-top:8px}
.eye{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.mt{margin-top:12px}
.mt0{margin-top:4px;font-size:14px}
.note{font-size:13px;margin-top:10px}
.lead{font-size:19px;font-weight:300;font-stretch:106%;letter-spacing:-0.02em;line-height:1.2}
.h2{font-size:22px;font-weight:600;font-stretch:108%;letter-spacing:-0.02em;margin:2px 0 6px}
.h3{font-size:17px;font-weight:600;margin:14px 0 6px}
.num{font-variant-numeric:tabular-nums}
.big{font-size:clamp(32px,10vw,42px);font-weight:600;font-stretch:118%;letter-spacing:-0.03em;line-height:1.05}
.big span{font-size:20px;font-weight:300;letter-spacing:-0.01em}
.hh{font-size:32px;font-weight:300;font-stretch:110%;letter-spacing:-0.02em;line-height:1}
.hh b{font-weight:700}
.empty{padding:16px;border:1px dashed var(--rule);border-radius:12px;font-size:14px}
.svc-h{display:flex;gap:12px;align-items:center}.svc-av{width:52px;height:52px;border-radius:12px;background:var(--ink);color:var(--inv);display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.promise{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.promise div{background:var(--tone);border-radius:12px;padding:12px;font-size:12px;line-height:1.3}.promise b{display:block;font-size:14px;margin-bottom:2px}
.gw{margin-bottom:8px}.gw-top{display:flex;gap:12px;align-items:flex-start}.gw-av{width:44px;height:44px;border-radius:10px;background:var(--ink);color:var(--inv);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.gtabs .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}.gtabs .chips::-webkit-scrollbar{display:none}.gtabs .chip{flex:none}
.callout{background:var(--tone);border-left:3px solid var(--ink);padding:12px 14px;border-radius:0 8px 8px 0;font-size:14px;margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* home */
.park{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;background:var(--tone);font-size:13px;font-weight:500;max-width:100%}
.park .ic{width:16px;height:16px}
.park span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.greet{font-size:28px;font-weight:300;font-stretch:108%;letter-spacing:-0.02em;margin-top:16px;line-height:1.1}
.greet b{font-weight:700}
.unit{background:var(--ink);color:var(--inv);padding:58px 20px 20px;clip-path:polygon(0 44px,50% 0,100% 44px,100% 100%,0 100%);border-radius:0 0 16px 16px}
.unit-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding-bottom:12px;border-bottom:1px solid color-mix(in srgb,var(--inv) 30%,transparent);margin-bottom:16px}
.unit-top span:first-child{font-weight:700}
.unit-l{font-size:14px}
.unit-n{font-size:clamp(34px,11vw,46px);font-weight:600;font-stretch:120%;letter-spacing:-0.03em;line-height:1.05;margin-top:4px}
.unit-s{font-size:14px;margin-top:6px}
.unit-b{display:flex;gap:8px;margin-top:18px}
.unit-b .btn{flex:1}
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 12px;border-radius:12px;background:var(--tone);font-size:12px;font-weight:500;text-align:center;line-height:1.2}
.qa .ic{width:24px;height:24px}
.buildc{display:block;width:100%}
.prog{display:flex;gap:6px;margin-bottom:12px}
.prog .fnd{width:28px;height:28px}
.buildc b{display:block;font-size:17px;font-weight:600}
.buildc span{font-size:14px}
.club-t{display:block;width:100%;background:#000;color:#fff;border-radius:14px;padding:18px;box-shadow:0 0 0 1px var(--edge)}
.club-t .ct{font-size:22px;font-weight:300;font-stretch:108%;letter-spacing:-0.02em;margin:2px 0 6px}
.club-t p:last-child{font-size:14px}

/* cards, rows, pills */
.card{background:var(--tone);border-radius:12px;padding:16px}
.card.mt{margin-top:16px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-bottom:1px solid var(--tone2);min-height:60px}
.row-i{width:40px;height:40px;border-radius:10px;background:var(--tone);display:grid;place-items:center;flex:none}
.row-i .fnd{width:20px;height:20px}
.row-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-t b{font-weight:600;font-size:15px}
.row-t span{font-size:13px}
.row-r{display:flex;align-items:center;gap:8px;flex:none}
.chev{width:18px;height:18px}
.amt{font-weight:600;font-stretch:112%}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.done{background:var(--ink);color:var(--inv)}
.pill.open{box-shadow:inset 0 0 0 1.2px var(--ink)}
.pill.act{background:var(--tone2);box-shadow:inset 0 0 0 2px var(--ink)}
.pill.idle{border:1px dashed var(--ink);padding:0 8px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--tone2);font-size:14px}
.kv b{text-align:right}
.kv-inv{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:8px}

/* buttons, chips, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:10px;background:var(--ink);color:var(--inv);font-weight:600;font-size:15px;text-align:center}
.btn .ic{width:18px;height:18px}
.btn.inv{background:var(--inv);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost-inv{background:transparent;color:var(--inv);box-shadow:inset 0 0 0 1.5px var(--inv)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.wide{width:100%}
.btn.wide+.btn.wide{margin-top:10px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row-b{display:flex;gap:8px}
.row-b .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--rule);font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--inv);box-shadow:none}
.chip:disabled{text-decoration:line-through;opacity:.4;cursor:not-allowed}
.lbl{font-size:13px;font-weight:600;margin:18px 0 8px}
.fld{display:block;margin-top:16px}
.fld>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.fld input,.fld textarea{width:100%;border:1px solid var(--rule);border-radius:10px;padding:12px;background:var(--bg);font-size:16px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--ink);outline-offset:1px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:10px;padding:0 12px;height:48px}
.search input{border:0;flex:1;min-width:0;background:transparent;font-size:16px;outline:none}
.tg{width:48px;height:28px;border-radius:14px;background:var(--tone2);box-shadow:inset 0 0 0 1px var(--rule);position:relative;flex:none}
.tg span{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 1px var(--rule);transition:transform .18s}
.tg.on{background:var(--ink);box-shadow:none}
.tg.on span{transform:translateX(20px);background:var(--inv);box-shadow:none}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--tone2)}
.toggle-row>span{display:flex;flex-direction:column;gap:3px}
.toggle-row>span span{font-size:13px}
.card .toggle-row{margin-top:14px;border-top-color:var(--rule)}

/* hero blocks */
.hero-b{background:var(--ink);color:var(--inv);border-radius:14px;padding:20px}
.bar-t{height:8px;border-radius:4px;background:var(--tone2);overflow:hidden;margin-top:10px}
.bar-t i{display:block;height:100%;background:var(--ink);border-radius:4px}
.bar-t.inv{background:color-mix(in srgb,var(--inv) 25%,transparent)}
.bar-t.inv i{background:var(--inv)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3 div{background:var(--tone);border-radius:12px;padding:12px}
.stats3 b{display:block;font-size:26px;font-weight:600;font-stretch:115%;letter-spacing:-0.02em}
.stats3 span{font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--tone);border-radius:12px;padding:14px}
.stat b{display:block;font-size:26px;font-weight:600;font-stretch:115%;letter-spacing:-0.02em}
.stat span{font-size:13px}
.sos{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;padding:16px;border-radius:12px;box-shadow:inset 0 0 0 2px var(--ink)}
.sos .ic{width:28px;height:28px}
.sos b{display:block;font-size:16px}
.sos span span{font-size:13px}
.notice{display:flex;gap:12px;align-items:flex-start}
.notice p{font-size:14px;margin-top:3px}

/* milestones */
.ms{display:flex;gap:14px;padding:10px 0;position:relative}
.ms .fnd{margin-top:1px}
.ms::after{content:"";position:absolute;left:10.5px;top:36px;bottom:-8px;width:1px;background:var(--rule)}
.ms:last-child::after{display:none}
.ms-t b{display:block;font-weight:600}
.ms-t span{font-size:13px}
.upd{padding:14px 0;border-bottom:1px solid var(--tone2)}
.upd svg{display:block;width:100%;height:auto;background:var(--tone);border-radius:10px;padding:10px;margin-bottom:10px}
.upd p+p{font-size:14px;margin-top:3px}
.frame{fill:none;stroke-width:1.8;stroke-linejoin:round}
.frame.done{stroke:var(--ink)}
.frame.todo{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 2}
.ground{stroke:var(--ink);stroke-width:1}

/* chart */
.chart{display:block;width:100%;height:auto}
.chart .bar{fill:var(--ink)}
.chart .bar-o{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3}
.chart text{fill:var(--ink);font-size:11px;font-family:inherit}
.chart .cv{font-weight:600}
.chart .axis{stroke:var(--rule)}
.hb{margin-top:12px}
.hb-l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.hb-t{height:10px;background:var(--tone2);border-radius:3px}
.hb-t i{display:block;height:100%;background:var(--ink);border-radius:3px}

/* club */
.mcard{background:#000;color:#fff;border-radius:16px;padding:20px;aspect-ratio:1.586;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--edge)}
.mcard>*{position:relative}
.mcard .dim{position:absolute;right:-18%;bottom:-30%;width:78%;fill:none;stroke:#fff;stroke-width:.5}
.mc-n{font-size:26px;font-weight:300;font-stretch:110%;letter-spacing:-0.02em;margin-top:4px}
.mc-b{display:flex;justify-content:space-between;font-size:13px;font-weight:600}

/* sheet, toast */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.scrim[hidden]{display:none}
.sheet{width:min(100%,460px);max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(24px);transition:transform .22s ease;outline:none;overscroll-behavior:contain}
.scrim.open .sheet{transform:none}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--rule);margin:4px auto 10px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sh-h h2{font-size:21px;font-weight:600;font-stretch:108%;letter-spacing:-0.02em}
.sh-s{font-size:14px;margin-top:4px}
.sheet .btn.wide{margin-top:20px}
.sheet .btn.wide+.btn.wide{margin-top:10px}
.qr-wrap{display:grid;place-items:center;margin:16px 0}
.qr{width:200px;height:200px}
.qr-bg{fill:#fff}
.qr-fg{fill:#000}
.chat{background:var(--tone);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;margin-top:14px}
.bub{background:var(--bg);border-radius:4px 12px 12px 12px;padding:10px 12px;font-size:14px;max-width:90%}
.bub b{font-size:12px}
.bub p{margin-top:3px}
.bub small{display:block;font-size:11px;margin-top:6px;text-align:right}
.docprev{display:grid;place-items:center;gap:6px;background:var(--tone);border-radius:12px;height:150px;margin-top:14px;font-size:13px;font-weight:600;align-content:center}
.docprev .ic{width:40px;height:40px;stroke-width:1.2}
.prof-t{display:flex;flex-direction:column;gap:3px}
.prof-t b{font-size:18px}
.prof-t span{font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);width:max-content;max-width:min(92vw,420px);background:var(--ink);color:var(--inv);padding:12px 16px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<nav class="nav" id="nav" aria-label="Main"></nav>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const sum = a => a.reduce((x, b) => x + b.amt, 0);
const pad2 = n => String(n).padStart(2, '0');

const I = {
  home:'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  receipt:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h4',
  cal:'M4 6h16v14H4zM4 10h16M8 3v5M16 3v5',
  wrench:'M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z',
  grid:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',
  bell:'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0',
  back:'M15 5l-7 7 7 7',
  chev:'M9 6l6 6-6 6',
  down:'M6 9l6 6 6-6',
  bolt:'M13 2L4 14h7l-1 8 9-12h-7z',
  drop:'M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z',
  shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
  permit:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4',
  doc:'M6 3h8l4 4v14H6zM14 3v4h4M9 13h6M9 17h6',
  rupee:'M7 4h10M7 8h10M7 4h3a4 4 0 0 1 0 8H7l7 8',
  chart:'M5 20V11M11 20V5M17 20v-8M3 20h18',
  bed:'M3 19V6M3 15h18v4M21 15v-2a3 3 0 0 0-3-3h-8v5M6.5 12.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4',
  users:'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21a7 7 0 0 1 14 0M17 3a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3',
  store:'M3 9l2-5h14l2 5zM3 9v1a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0V9M5 13v8h14v-8',

V.chamberBook = () => {
  const k = S.param, sp = SPACES[k], f = S.vf;
  if (f.day === undefined) f.day = dl(DAYS[1]);
  if (f.add === undefined) f.add = [];
  let body = '', pay = 0, free = 0, ok = true, when = '';
  if (sp.unit === 'hr') {
    const taken = takenFor(f.day);
    if (f.dur === undefined) f.dur = '2';
    if (f.start === undefined) { for (let h = 9; h <= 16; h++) { if (!taken.includes(h) && !taken.includes(h + 1)) { f.start = pad2(h) + ':00'; break; } } }
    const st = +f.start.slice(0, 2), dur = +f.dur, end = st + dur;
    ok = end <= 18 && !Array.from({length:dur}, (_, i) => st + i).some(h => taken.includes(h));
    free = sp.credit ? Math.min(dur, S.credits) : 0;
    pay = (dur - free) * sp.rate;
    when = `${f.day}, ${f.start} to ${pad2(end)}:00`;
    body = `<p class="lbl">Start time</p>${chips('start', Array.from({length:9}, (_, i) => ({v:pad2(9 + i) + ':00', off:taken.includes(9 + i)})), {rr:1})}<p class="lbl">Duration</p>${chips('dur', [{v:'1', l:'1 hour'}, {v:'2', l:'2 hours'}, {v:'3', l:'3 hours'}, {v:'4', l:'4 hours'}], {rr:1})}${ok ? '' : `<p class="callout">That time overlaps another booking or runs past 18:00. Pick a shorter duration or another start time.</p>`}`;
  } else {
    if (f.days === undefined) f.days = '1';
    pay = +f.days * sp.rate;
    when = `${f.day}, ${f.days === '1' ? '1 day' : f.days + ' days'}`;
    body = `<p class="lbl">Number of days</p>${chips('days', [{v:'1', l:'1 day'}, {v:'2', l:'2 days'}, {v:'3', l:'3 days'}], {rr:1})}<p class="note">The events team calls you to plan the layout, power and logistics.</p>`;
  }
  S.calc = {ok, free, pay, when};
  return `<section class="pad"><div class="card"><p class="eye">LML Chambers</p><h2 class="h2">${sp.n}</h2><p>${sp.cap}. ${inr(sp.rate)} per ${sp.unit === 'hr' ? 'hour' : 'day'}${sp.credit ? '. Your free hours apply' : ''}.</p></div>
    <p class="lbl">Date</p>${chips('day', DAYS.map(dl), {rr:1})}${body}
    <p class="lbl">Add to your booking</p>${chips('add', ['Catering from park F&B', 'AV and recording', 'Reception and signage', 'Buyer delegation hosting'], {m:1})}
    <div class="card mt"><div class="kv"><span>When</span><b>${when}</b></div>${sp.credit ? `<div class="kv"><span>Free hours used</span><b>${free} of ${S.credits} left</b></div>` : ''}<div class="kv"><span>${sp.unit === 'hr' ? 'To pay now' : 'Estimated cost'}</span><b class="num">${inr(pay)}</b></div><button class="btn wide mt" data-act="bookChamber"${ok ? '' : ' disabled'}>${sp.unit === 'hr' ? 'Confirm booking' : 'Request booking'}</button></div></section>`;
};

/* ---------- engine ---------- */
let SHEET = null, tt;

  if (S.view === 'home') return `<div class="brand">${LOGO}</div>${bell}`;
  return `${S.stack.length ? `<button class="icon-btn back" data-act="back" aria-label="Back">${ic('back')}</button>` : ''}<h1 class="ttl">${esc(title())}</h1>${bell}`;

  const root = S.stack.length ? S.stack[0].v : S.view;
  const items = [['home', 'Home', 'home'], ...Object.keys(NAVL).filter(can).slice(0, 3).map(k => [k, NAVL[k][0], NAVL[k][1]]), ['menu', 'Menu', 'grid']];
  return `<div class="nav-in">` + items.map(([k, l, i]) => `<button data-go="${k}" data-root="1" class="${root === k ? 'on' : ''}"${root === k ? ' aria-current="page"' : ''}>${ic(i)}<span>${t(l)}</span></button>`).join('') + `</div>`;
}

  const y = window.scrollY;

  $('#view').innerHTML = V[S.view]();
  $('#nav').innerHTML = nav();
  document.title = S.view === 'home' ? 'LML One' : `${title()} | LML One`;

function go(v, p, root) {
  if (!can(v)) { toast('Your role doesn’t include this. Ask the owner for access.'); return; }
  if (root) S.stack = []; else S.stack.push({v:S.view, p:S.param, y:window.scrollY, f:S.vf});
  S.view = v; S.param = p == null ? null : p; S.vf = {};

}

/* ---------- actions ---------- */
const A = {
  back: () => back(),
  closeSheet: () => closeSheet(),
  toastMsg: (el, p) => { closeSheet(); toast(p); },
  chip(el) {
    const g = el.dataset.g, v = el.dataset.v, store = el.closest('#sheet') ? S.sf : S.vf;
    if (el.dataset.m) {
      const a = store[g] || (store[g] = []), i = a.indexOf(v);
      if (i >= 0) a.splice(i, 1); else a.push(v);
      el.classList.toggle('on', i < 0); el.setAttribute('aria-pressed', String(i < 0));
    } else {
      if (el.dataset.st) { if (g === 'limit') S.limit = +v || Infinity; else S[g] = v; } else store[g] = v;
      el.parentElement.querySelectorAll('.chip').forEach(c => { const on = c === el; c.classList.toggle('on', on); c.setAttribute('aria-pressed', String(on)); });
    }
    if (el.dataset.rr) { if (el.closest('#sheet')) reSheet(); else render(true); }
    if (g === 'role') toast(`Viewing as ${v}`);
  },
  toggle(el, k) {
    S[k] = !S[k]; render(true);
    if (k === 'autopay') toast(S.autopay ? 'Autopay on. Bills pay on their due date.' : 'Autopay off');
  },
  payAll() { const ids = S.bills.filter(b => b.st === 'due').map(b => b.id); if (ids.length) openSheet('pay', ids.join(',')); },
  payOne: (el, p) => openSheet('pay', p),
  confirmPay() {
    const f = S.sf, ids = f.ids, amt = f.amt, method = f.method;
    closeSheet();
    if (f.needs) {
      if (ids.some(inAppr)) { toast('Already waiting for the owner’s approval.'); return; }
      const names = S.bills.filter(b => ids.includes(b.id)).map(b => b.name).join(', ');
      S.approvals.push({id:'a' + Date.now(), ids, by:'Sunil Yadav', label:names, amt});
      notify(`Sunil Yadav asked to pay ${inr(amt)}`, 'team');
      render(true); toast('Sent to Rajiv for approval.'); return;
    }
    payBills(ids); render(true); toast(`Paid ${inr(amt)} by ${method}. GST invoice sent to accounts.`);
  },
  approve(el, p) { const a = S.approvals.find(x => x.id === p); if (!a) return; payBills(a.ids); render(true); toast(`Approved. ${inr(a.amt)} paid and Sunil has been told.`); },
  decline(el, p) { S.approvals = S.approvals.filter(x => x.id !== p); render(true); toast('Declined. Sunil has been told.'); },
  invoice: (el, p) => toast(`GST invoice for ${p} emailed to accounts@aroraprecision.in`),
  photo() { S.sf.photo = !S.sf.photo; reSheet(); },
  raise() {
    const f = S.sf, d = (f.desc || '').trim();
    if (!d) { toast('Describe the issue so the right team can fix it.'); return; }
    const id = 'T-' + (S.tseq++), who = TEAM_FOR[f.cat];
    S.tickets.unshift({id, cat:f.cat, ti:d.length > 70 ? d.slice(0, 68) + '…' : d, st:'Assigned', sla:f.pri === 'Urgent' ? '4h left' : '24h left', who, at:'Just now'});
    closeSheet();
    if (S.view !== 'desk' && can('desk')) go('desk'); else render(true);
    toast(`Request ${id} raised. ${who} is on it.`);
  },
  escalate() { closeSheet(); toast('Escalated. The park manager will call you shortly.'); },
  rate() { closeSheet(); toast('Thanks. Your rating goes to the park team.'); },
  uploadPermit(el, p) {
    const x = S.permits.find(z => z.id === p);
    x.st = 'In review'; x.s = 'Drawing uploaded today. In review'; x.note = 'Your fire layout drawing is in. LML’s compliance desk is filing your application with the fire department.';
    closeSheet(); render(true); toast('Uploaded. Your Fire NOC is now in review.');
  },
  applyPermit() {
    const f = S.sf, dates = f.from && f.to ? `${fmtD(f.from)} to ${fmtD(f.to)}. ` : f.from ? `From ${fmtD(f.from)}. ` : '';
    S.permits.unshift({id:'p' + Date.now(), ti:f.type, st:'Submitted', s:`${dates}Submitted today`, note:'The estate office reviews new applications within 2 working days. You’ll hear back here and on WhatsApp.'});
    closeSheet(); render(true); toast('Application submitted. You’ll hear back within 2 working days.');
  },
  createPass() {
    const f = S.sf, n = (f.name || '').trim();
    if (!n) { toast('Add the visitor’s name to create the pass.'); return; }
    const id = 'g' + Date.now();
    S.passes.unshift({id, name:n, purpose:f.purpose, when:f.when, veh:(f.veh || '').trim().toUpperCase()});
    render(true); openSheet('passQR', id);
  },
  bookTruck() {
    const f = S.sf, v = (f.veh || '').trim();
    if (!v) { toast('Add the vehicle number so the gate can let it in.'); return; }
    S.trucks.unshift({when:`${f.day}, ${f.slot}`, size:f.size, veh:v.toUpperCase(), load:(f.load || '').trim()});
    closeSheet(); render(true); toast(`Truck slot booked for ${f.day}, ${f.slot}.`);
  },
  svcBook(el, p) {
    const [c, i] = p.split('|'), x = SVC[c].list[+i], f = S.sf, pro = PROS[Math.floor(Math.random() * PROS.length)], id = 's' + Date.now();
    const b = {id, svc:x[0], pro:pro[0], rating:pro[1], jobs:pro[2], when:`${f.day}, ${f.slot}`, where:f.where, st:'Confirmed'};
    S.svcB.unshift(b);
    S.passes.unshift({id:'g' + Date.now(), name:pro[0], purpose:'Service', when:`${f.day}, ${f.slot}`, veh:''});
    render(true); openSheet('svcDone', id);
  },
  svcQuote(el, p) { closeSheet(); toast(`Quote request sent for ${p}. Three partners reply within a working day.`); },
  svcUrgent() {
    const f = S.sf, pro = PROS[Math.floor(Math.random() * PROS.length)], id = 's' + Date.now();
    S.svcB.unshift({id, svc:f.what, pro:pro[0], rating:pro[1], jobs:pro[2], when:'Today, within 60 minutes', where:'Shop floor', st:'On the way'});
    S.passes.unshift({id:'g' + Date.now(), name:pro[0], purpose:'Urgent service', when:'Today, now', veh:''});
    render(true); openSheet('svcDone', id); toast(`${pro[0]} is on the way. Gate security has their pass.`);
  },
  svcRate(el, p) { const b = S.svcB.find(z => z.id === p); if (b) b.rated = true; closeSheet(); render(true); toast('Thanks. Your rating helps other park owners choose.'); },
  amc(el, p) { const f = S.sf; closeSheet(); toast(`${AMC[+p][0]} starts in ${f.start}. The LML services desk will call you to schedule the first visit.`); },
  gApprove(el, p) {
    const w = S.waiting.find(x => x.id === p); if (!w) return;
    S.waiting = S.waiting.filter(x => x !== w);
    S.inside.unshift({id:'i' + Date.now(), name:w.name, s:`${w.type}. In since ${hm()} at ${w.gate}`});
    S.glog.unshift([hm(), `${w.name} entered at ${w.gate}`, 'Approved by you']);
    render(true); toast(`${w.name} can go in. Security at ${w.gate} has been told.`);
  },
  gDeny(el, p) {
    const w = S.waiting.find(x => x.id === p); if (!w) return;
    S.waiting = S.waiting.filter(x => x !== w);
    S.glog.unshift([hm(), `${w.name} turned away at ${w.gate}`, 'Denied']);
    render(true); toast(`${w.name} has been turned away.`);
  },
  gLeave(el, p) {
    const w = S.waiting.find(x => x.id === p); if (!w) return;
    S.waiting = S.waiting.filter(x => x !== w);
    S.parcels.unshift({id:'k' + Date.now(), from:w.name, s:`${w.why}. Left at the security desk at ${hm()}`});
    S.glog.unshift([hm(), `${w.name} left parcels at the security desk`, 'Delivery']);
    render(true); toast('Left at the security desk. Collect it any time, or have it sent to your unit.');
  },
  gOut(el, p) {
    const x = S.inside.find(z => z.id === p); if (!x) return;
    S.inside = S.inside.filter(z => z !== x);
    S.glog.unshift([hm(), `${x.name} checked out`, 'Checked out']);
    render(true); toast(`${x.name} is checked out. Gate security has been told.`);
  },
  gParcel(el, p) { S.parcels = S.parcels.filter(k => k.id !== p); render(true); toast('A gate runner is bringing it to your unit.'); },
  freqPass() {
    const f = S.sf, n = (f.name || '').trim();
    if (!n) { toast('Add a name or company for the pass.'); return; }
    if (!(f.days || []).length) { toast('Pick at least one day.'); return; }
    const code = String(100000 + Math.floor(Math.random() * 900000)).replace(/(\d{3})(\d{3})/, '$1 $2');
    const days = f.days.length === 7 ? 'Every day' : f.days.join(', ');
    S.frequent.unshift({id:'f' + Date.now(), name:n, s:`${days}, ${f.win}. Valid for ${f.valid}`, code});
    closeSheet(); render(true); toast(`Frequent pass created. Gate code ${code} sent to ${n} on WhatsApp.`);
  },
  groupPass() {
    const f = S.sf, n = (f.name || '').trim();
    if (!n) { toast('Say what the group pass is for.'); return; }
    S.groups.unshift({id:'gp' + Date.now(), name:n, s:`${f.day}. ${f.size} guests. ${f.venue}`});
    S.glog.unshift([hm(), `Group pass created: ${n}`, 'Group pass']);
    closeSheet(); render(true); toast('Group pass created. Share one link and each guest gets their own QR code.');
  },
  blockPerson() {
    const f = S.sf, n = (f.name || '').trim();
    if (!n) { toast('Add the name or vehicle number to block.'); return; }
    S.blocked.unshift({id:'b' + Date.now(), name:n, s:`Blocked today${(f.why || '').trim() ? '. ' + f.why.trim() : ''}`});
    closeSheet(); render(true); toast(`${n} is blocked at every gate.`);
  },
  goodsPass() {
    const f = S.sf, w = (f.what || '').trim();
    if (!w) { toast('Say what’s moving so security can check the load.'); return; }
    const back = f.kind === 'Returnable' && f.back ? `, due back ${f.back}` : '';
    S.goods.unshift({id:'m' + Date.now(), ti:w, s:`${f.dir}, ${f.kind.toLowerCase()}${back}${(f.veh || '').trim() ? '. ' + f.veh.trim().toUpperCase() : ''}`, st:'Expected'});
    closeSheet(); render(true); toast('Goods pass created. Security checks the load against it at the gate.');
  },
  addWorker() {
    const f = S.sf, n = (f.name || '').trim();
    if (!n) { toast('Add the worker’s name.'); return; }
    closeSheet(); render(true); toast(`${n} is added to ${f.shift}. Their gate code is on its way by SMS.`);
  },
  addVehicle() {
    const f = S.sf, n = (f.no || '').trim().toUpperCase();
    if (!n) { toast('Add the vehicle number.'); return; }
    S.vehicles.unshift({id:'v' + Date.now(), no:n, s:`${f.type}. Sticker ready at the gate office`});
    closeSheet(); render(true); toast(`${n} is registered. Collect the sticker from the gate office.`);
  },
  saveIcom() { const v = (S.sf.icom || '').trim(); if (!v) { toast('Add a number for the gate to call.'); return; } S.icom = v; closeSheet(); render(true); toast('Gate intercom number saved.'); },
  sos() { closeSheet(); notify('SOS sent to park security from Plot B-14', 'gate'); render(true); toast('Security alerted. The response team is on its way to Plot B-14.'); },
  emergency: () => toast('Apollo Clinic alerted. An ambulance is on its way to Plot B-14.'),
  siteVisit() { const f = S.sf; closeSheet(); toast(`Site visit booked for ${f.day}, ${f.time}.`); },
  bookChamber() {
    const sp = SPACES[S.param], c = S.calc;
    if (!c || !c.ok) return;
    S.bookings.unshift({id:'c' + Date.now(), sp:S.param, when:c.when, free:c.free, add:(S.vf.add || []).slice(), req:sp.unit !== 'hr'});
    S.credits -= c.free;
    back();
    toast(sp.unit === 'hr' ? `Booked: ${sp.n}, ${c.when}.` : 'Request sent. The events team will call you today.');
  },
  cancelBooking(el, p) {
    const b = S.bookings.find(x => x.id === p); if (!b) return;
    S.credits += b.free; S.bookings = S.bookings.filter(x => x.id !== p);
    render(true); toast(b.free ? 'Booking cancelled. Your free hours are back.' : 'Booking cancelled.');
  },
  bookCfc(el, k) {
    const c = CFC[k], f = S.sf, cost = +f.hrs * c.rate;
    S.cfcB.unshift({ti:c.n, s:`${f.day}, from ${f.slot}, ${f.hrs === '8' ? 'full day' : f.hrs + ' hours'}`});
    closeSheet(); render(true); toast(`Booked. ${inr(cost)} goes on your monthly bill.`);
  },
  checkIn() {
    const f = S.sf, n = (f.who || '').trim(), r = S.quarters.rooms.find(x => x.n === f.room);
    if (!n) { toast('Add the team member’s name to check them in.'); return; }
    if (!r || r.used >= r.beds) { toast('Pick a room with a free bed.'); return; }
    r.used++; S.quarters.log.unshift({ti:`${n} checked in`, s:`${r.n}. From ${f.when}`});
    closeSheet(); render(true); toast(`${n} is checked in to ${r.n}.`);
  },
  ecoSubmit(el, p) {
    const f = S.sf; let it;
    if (p === 'hotel') {
      const g = (f.guest || '').trim(); if (!g) { toast('Add the guest’s name to request rooms.'); return; }
      it = {i:'hotel', ti:`Hampton by Hilton for ${g}`, s:`${f.rooms} ${f.rooms === '1' ? 'room' : 'rooms'} from ${f.day}, ${f.nights} ${f.nights === '1' ? 'night' : 'nights'}`, st:'Requested', m:'Rooms requested. Confirmation comes on WhatsApp.'};
    } else if (p === 'clinic') {
      const n = (f.pat || '').trim(); if (!n) { toast('Add the patient’s name to book.'); return; }
      it = {i:'health', ti:`Apollo Clinic for ${n}`, s:`${f.type}, ${f.slot}`, st:'Confirmed', m:'Appointment confirmed.'};
    } else if (p === 'food') {
      it = {i:'food', ti:`${f.outlet} for ${f.n} people`, s:`To ${f.to} at ${f.time}`, st:'Ordered', m:'Order placed. It goes on your monthly bill.'};
    } else {
      it = {i:'bed', ti:`${f.n} more beds in the ${f.type.toLowerCase()}`, s:`From ${f.from}`, st:'Requested', m:'Request sent to the LML Staff Quarters desk.'};
    }
    S.eco.unshift(it); closeSheet(); render(true); toast(it.m);
  },
  quote(el, p) { el.textContent = 'Requested'; el.disabled = true; toast(`Quote requested from ${p}. Replies come to your inbox here.`); },
  finSubmit() { const f = S.sf; closeSheet(); toast(`Request for ${f.amt} sent to partner lenders. An LML finance manager will call you within a day.`); },
  connect(el, p) { el.textContent = 'Sent'; el.disabled = true; toast(`Intro request sent to ${p}.`); },
  growSubmit(el, k) {
    const f = S.sf;
    if (k === 'refer' && !(f.rn || '').trim()) { toast('Add their name so we know who to reach.'); return; }
    const m = {expand:'Request sent. Phase 2 plans reach you before launch.', lease:'Request sent. The allocation team will share factories that fit.', refer:`Thanks. We’ll reach out to ${(f.rn || '').trim()}. You earn maintenance credit if they join.`, list:'Request sent. LML’s resale desk will call you.'};
    closeSheet(); toast(m[k]);
  },
  rsvp(el, p) { S.rsvp[p] = !S.rsvp[p]; render(true); toast(S.rsvp[p] ? 'Done. You’re on the list.' : 'RSVP withdrawn.'); },
  saveMember(el, p) { const m = S.team.find(z => z.id === p); m.r = S.sf.r; closeSheet(); render(true); toast(`${m.n} is now ${m.r}.`); },
  removeMember(el, p) { const m = S.team.find(z => z.id === p); S.team = S.team.filter(z => z.id !== p); closeSheet(); render(true); toast(`${m.n} removed from the team.`); },
  addMember() {
    const f = S.sf, n = (f.n || '').trim();
    if (!n) { toast('Add their name to send the invite.'); return; }
    S.team.push({id:'m' + Date.now(), n, r:f.r, ph:(f.ph || '').trim()});
    closeSheet(); render(true); toast(`Invite sent to ${n} on WhatsApp.`);
  },
  uploadSubsidy(el, p) {
    const c = S.subsidy.find(z => z.id === p); c.st = 'Filed'; c.s = 'Documents uploaded today. Filed with the department';
    render(true); toast('Uploaded. Your subsidy manager files it next.');
  },
  readAll() { S.notifs.forEach(n => { n.read = true; }); render(true); reSheet(); },
  openNotif(el, p) {
    const n = S.notifs[+p]; n.read = true; closeSheet();
    if (can(n.go)) go(n.go); else { render(true); toast('Your role doesn’t include this. Ask the owner for access.'); }
  }
};

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const sc = $('#scrim');
  if (e.target === sc) { closeSheet(); return; }
  const el = e.target.closest('[data-go],[data-act],[data-sheet]');
  if (!el || el.disabled) return;
  const p = el.dataset.p;
  if (el.dataset.go) { closeSheet(); go(el.dataset.go, p, el.dataset.root === '1'); }
  else if (el.dataset.sheet) openSheet(el.dataset.sheet, p);
  else if (A[el.dataset.act]) A[el.dataset.act](el, p);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.f) return;
  (el.closest('#sheet') ? S.sf : S.vf)[el.dataset.f] = el.value;
  if (el.dataset.live === 'dir') $('#dirlist').innerHTML = dirList();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && SHEET) closeSheet(); });

render();
})();
</script>
</body>
</html>
